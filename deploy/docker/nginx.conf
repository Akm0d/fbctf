limit_req_zone $binary_remote_addr zone=fbctf_requests:10m rate=15r/s;

server {
  listen 8080;
  server_name localhost;
  server_tokens off;

  root /var/www/fbctf/src;
  index index.php;
  client_max_body_size 25M;

  add_header Cache-Control "no-cache, no-store" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.youtube.com; img-src 'self' data: https://i.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self'; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Referrer-Policy "same-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location = /tv {
    rewrite ^ /index.php?p=tv last;
  }

  location ~ \.php$ {
    try_files $uri =404;
    limit_req zone=fbctf_requests burst=30 nodelay;
    include fastcgi_params;
    fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass app:9000;
  }

  location ~ /\. {
    deny all;
  }
}
